[project]
name = "book-api"
version = "0.1.0"
description = "FASTAPI application for books"
authors = [
    {name = "yuliyasor88"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "fastapi (>=0.124.1,<0.125.0)",
    "pydentic (>=0.0.1.dev3,<0.0.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
